<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Memory - 200X</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .glitch-text {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 2px 0px 1px blue, -2px 0px 1px lime;
            animation: shake 0.2s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="retro-ui" style="display: none;">
        <div class="window" id="log-window">
            <div class="window-header">
                <span id="window-title">SYSTEM_MEMORY_LOG.TXT</span>
                <span class="close-btn" id="close-log">[X]</span>
            </div>
            <div class="window-body" id="log-text"></div>
        </div>
    </div>

    <div id="start-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 100; background: rgba(0,0,0,0.9); color: white; display: flex; align-items: center; justify-content: center; font-family: monospace; cursor: pointer; flex-direction: column;">
        <p>[ CLICK TO WAKE UP ]</p>
        <p style="font-size: 10px; color: #555; margin-top: 10px;">(Use WASD to explore)</p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
